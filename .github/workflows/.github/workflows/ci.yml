# Continuous Integration pipeline
# Runs automatically on every push and pull request to main.
# Three quality gates: lint check, security scan, unit tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Lint (stop on syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security scan (fail on medium or high issues)
        run: bandit -r . -x ./tests,./.venv,./venv -ll

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
